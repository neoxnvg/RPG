name: Validar e compilar RPG
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: python3 scripts/export-html.py
      - uses: actions/upload-artifact@v4
        with:
          name: aether-site
          path: dist
          if-no-files-found: error

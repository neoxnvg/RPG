name: Build and publish web
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-rpg-web
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: python3 -m unittest discover -s tests -p 'test_online.py' -v
      - run: npm run build
      - run: python3 scripts/export-html.py
      - name: Publish compiled files to web branch
        run: bash scripts/publish-web.sh
